<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Certificate Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f0f2f5; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: #fff; padding: 25px; border-radius: 10px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #1a365d; margin-bottom: 10px; }
    p { color: #555; margin-bottom: 15px; font-size: 14px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    #result { margin-top: 20px; display: none; }
    .msg { padding: 10px; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    canvas { max-width: 100%; height: auto; border-radius: 6px; display: none; margin-top: 10px; }
    .dl-btn { display: inline-block; width: 100%; padding: 12px; background: #16a34a; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>E-Certificate Portal</h2>
    <p>Enter your Name, Roll Number, or Email to download your certificate.</p>
    <input type="text" id="userInput" placeholder="Enter Name, Roll No, or Email...">
    <button onclick="searchCert()">Search Certificate</button>

    <div id="result">
      <div id="status" class="msg"></div>
      <canvas id="canvas"></canvas>
      <a id="dl" class="dl-btn" style="display:none;" download="Certificate.png">Download Certificate</a>
    </div>
  </div>

  <script>

    // Update "Student Name" and email placeholders with actual student names/emails.
    const dataset = [
      { name: "Ritu Kumari", roll: "BSCAI/60034/26", email: "bscai60034.26@bitmesra.ac.in" },
      { name: "Nikunj Kumari", roll: "BSCAI/60018/26", email: "bscai60018.26@bitmesra.ac.in" },
      { name: "Puja Kumari", roll: "BT/60052/26", email: "btech60052.26@bitmesra.ac.in" },
      { name: "Christy Dutta", roll: "BT/60085/26", email: "btech60085.26@bitmesra.ac.in" },
      { name: "Samridhi Priya", roll: "BT/60027/26", email: "btech60027.26@bitmesra.ac.in" },
      { name: "Palak Bibhuti", roll: "BT/60110/26", email: "palak.bibhuti@gmail.com" },
      { name: "Anjali Bharti", roll: "BT/60029/26", email: "btech60029.26@bitmesra.ac.in" },
      { name: "Ritika Sahu", roll: "BT/60042/26", email: "btech60042.26@bitmesra.ac.in" },
      { name: "Sagar Gupta", roll: "BT/60035/26", email: "btech60035.26@bitmesra.ac.in" },
      { name: "Prasenjeet Kumar", roll: "BT/60011/26", email: "btech60011.26@bitmesra.ac.in" },
      { name: "Rehan Basu", roll: "BT/60032/26", email: "btech60032.26@bitmesra.ac.in" },
      { name: "Ritisha Verma", roll: "BT/60091/26", email: "srivastava.santosh009@gmail.com" },
      { name: "Akshat Shanker", roll: "BT/60054/26", email: "akshat.shanker.143@gmail.com" },
      { name: "Pushkar Pratap Singh", roll: "BT/60061/26", email: "btech60061.26@bitmesra.ac.in" },
      { name: "Ujjwal Kumar", roll: "BT/60064/26", email: "btech60064.26@bitmesra.ac.in" },
      
      // Complete entries with names:
      { name: "Student Name", roll: "BT/60041/26", email: "btech60041.26@bitmesra.ac.in" },
      { name: "Student Name", roll: "BT/60043/26", email: "btech60043.26@bitmesra.ac.in" },

      { name: "Student Name", roll: "BT/60062/26", email: "btech60062.26@bitmesra.ac.in" },
      { name: "Student Name", roll: "BT/60044/26", email: "btech60044.26@bitmesra.ac.in" },

      { name: "Student Name", roll: "BT/60015/26", email: "btech60015.26@bitmesra.ac.in" },
      { name: "Student Name", roll: "BT/60096/26", email: "btech60096.26@bitmesra.ac.in" },
      { name: "Student Name", roll: "BT/60095/26", email: "btech60095.26@bitmesra.ac.in" },
      { name: "Student Name", roll: "BT/60087/26", email: "btech60087.26@bitmesra.ac.in" },
      { name: "Student Name", roll: "BT/60088/26", email: "btech60088.26@bitmesra.ac.in" }
    ];

    function normalize(str) {
      return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function searchCert() {
      const rawInput = document.getElementById('userInput').value.trim();
      const normInput = normalize(rawInput);
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const canvas = document.getElementById('canvas');
      const dl = document.getElementById('dl');

      if (!rawInput) {
        alert("Please enter Name, Roll No, or Email.");
        return;
      }

      const match = dataset.find(user => {
        const normName = normalize(user.name);
        const normRoll = normalize(user.roll);
        const normEmail = normalize(user.email);

        return (normName && normName === normInput) ||
               (normRoll && normRoll === normInput) ||
               (normEmail && normEmail === normInput) ||
               (normRoll && normRoll.includes(normInput) && normInput.length >= 4);
      });

      result.style.display = "block";

      if (match) {
        if (!match.name || match.name === "Student Name") {
          status.className = "msg error";
          status.innerText = "Roll No verified (" + match.roll + "), but student name is missing in dataset.";
          canvas.style.display = "none";
          dl.style.display = "none";
          return;
        }

        status.className = "msg success";
        status.innerText = "Verified! Certificate ready for: " + match.name;
        drawCert(match.name);
      } else {
        status.className = "msg error";
        status.innerText = "No match found! Check your spelling or Roll No.";
        canvas.style.display = "none";
        dl.style.display = "none";
      }
    }

    function drawCert(nameText) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const dl = document.getElementById('dl');

      const img = new Image();
      // Ensure your exported Canva image is saved as 'certificate-template.png' in the same folder
      img.src = 'certificate-template.png';

      img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);

        ctx.fillStyle = "#1a365d";
        ctx.font = "bold " + Math.round(canvas.height * 0.045) + "px sans-serif";
        ctx.textAlign = "center";
        // Adjust vertical position (0.52 = 52% from top) according to your template design
        ctx.fillText(nameText, canvas.width / 2, canvas.height * 0.52);

        canvas.style.display = "block";
        dl.href = canvas.toDataURL("image/png");
        dl.style.display = "block";
      };

      img.onerror = function() {
        // Backup generator if template image is not found in folder
        canvas.width = 1000;
        canvas.height = 700;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1000, 700);
        ctx.strokeStyle = "#1a365d";
        ctx.lineWidth = 10;
        ctx.strokeRect(20, 20, 960, 660);

        ctx.fillStyle = "#1a365d";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("CERTIFICATE OF PARTICIPATION", 500, 150);
        ctx.fillText(nameText, 500, 350);

        canvas.style.display = "block";
        dl.href = canvas.toDataURL("image/png");
        dl.style.display = "block";
      };
    }
  </script>
</body>
</html>
