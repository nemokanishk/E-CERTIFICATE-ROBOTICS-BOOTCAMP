<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Certificate Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); text-align: center; }
    h1 { color: #1e293b; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.4; }
    input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #2563eb; }
    button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    .result { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 600; display: none; line-height: 1.4; }
    .error { background-color: #fee2e2; color: #991b1b; }
    .success { background-color: #dcfce7; color: #166534; }
  </style>
</head>
<body>

  <div class="card">
    <h1>E-Certificate Portal</h1>
    <p class="subtitle">Enter your Name, Roll Number, or Email to download your certificate.</p>
    
    <input type="text" id="searchInput" placeholder="BT/60026/26 or Name">
    <button onclick="searchCertificate()">Search Certificate</button>

    <div id="resultBox" class="result"></div>
  </div>

  <script>
    const dataset = [
      { name: "Ritu Kumari", roll: "BSCAI/60034/26", email: "bscai60034.26@bitmesra.ac.in" },
      { name: "Nikunj Kumari", roll: "BSCAI/60018/26", email: "bscai60018.26@bitmesra.ac.in" },
      { name: "Puja Kumari", roll: "BT/60052/26", email: "btech60052.26@bitmesra.ac.in" },
      { name: "Christy Dutta", roll: "BT/60085/26", email: "btech60085.26@bitmesra.ac.in" },
      { name: "Samridhi Priya", roll: "BT/60027/26", email: "btech60027.26@bitmesra.ac.in" },
      { name: "Palak Bibhuti", roll: "BT/60110/26", email: "palak.bibhuti@gmail.com" },
      { name: "Anjali Bharti", roll: "BT/60029/26", email: "btech60029.26@bitmesra.ac.in" },
      { name: "Ritika Sahu", roll: "BT/60042/26", email: "btech60042.26@bitmesra.ac.in" },
      { name: "Sagar Gupta", roll: "BT/60035/26", email: "btech60035.26@bitmesra.ac.in" },
      { name: "Prasenjeet Kumar", roll: "BT/60011/26", email: "btech60011.26@bitmesra.ac.in" },
      { name: "Rehan Basu", roll: "BT/60032/26", email: "btech60032.26@bitmesra.ac.in" },
      { name: "Ritisha Verma", roll: "BT/60091/26", email: "srivastava.santosh009@gmail.com" },
      { name: "Akshat Shanker", roll: "BT/60054/26", email: "akshat.shanker.143@gmail.com" },
      { name: "Pushkar Pratap Singh", roll: "BT/60061/26" },
      { name: "Ujjwal Kumar", roll: "BT/60064/26" },
      { roll: "BT/60041/26" },
      { roll: "BT/60043/26" },
      { roll: "BT/60048/26" },
      { roll: "BT/60025/26" },
      { roll: "BT/60105/26" },
      { roll: "BT/60004/26" },
      { roll: "BT/60053/26" },
      { roll: "BT/60062/26" },
      { roll: "BT/60044/26" },
      { roll: "BT/60049/26" },
      { roll: "BT/60005/26" },
      { roll: "BT/60015/26" },
      { roll: "BT/60096/26" },
      { roll: "BT/60095/26" },
      { roll: "BT/60087/26" },
      { roll: "BT/60088/26" }
    ];

    function searchCertificate() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const resultBox = document.getElementById("resultBox");

      if (!query) {
        resultBox.style.display = "block";
        resultBox.className = "result error";
        resultBox.innerText = "Please enter a Roll No, Name, or Email.";
        return;
      }

      const match = dataset.find(item => 
        (item.roll && item.roll.toLowerCase() === query) ||
        (item.name && item.name.toLowerCase().includes(query)) ||
        (item.email && item.email.toLowerCase() === query)
      );

      resultBox.style.display = "block";
      if (match) {
        resultBox.className = "result success";
        resultBox.innerHTML = `Certificate Found!<br><b>${match.name || "Attendee"}</b> (${match.roll})`;
      } else {
        resultBox.className = "result error";
        resultBox.innerText = "No match found! Check your spelling or Roll No.";
      }
    }
  </script>
</body>
</html>
